org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -Djava.io.tmpdir=D:/tools/gradle-tmp
android.useAndroidX=true
# 禁用 Kotlin 增量编译,规避 "Could not close incremental caches" 缓存损坏错误。
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# AGP 8.x 传统模式:插件生态(KGP 自动注入)在 built-in Kotlin 关闭时工作正常。
android.builtInKotlin=false
